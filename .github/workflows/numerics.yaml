# Numerical regressions the test suite cannot see.
#
# `gradient-check` runs on every pull request: one brms-generated program per
# family, compiled with model methods, and grad_log_prob() asked to be finite
# and to agree with central differences over a grid of parameter points, with
# tail responses in the data. R CMD check compares R and Stan *values*; a value
# can be finite while its gradient is NaN (see benchmarks/gradient_check.R for
# the case that motivated this), and that shows up in a fit as divergent
# transitions or a rejected init, never as a failed test.
#
# `gradient-cost` runs when a pull request carries the `benchmark` label, or on
# dispatch: it generates each family's program from the PR and from its base,
# and for the families whose Stan code differs, compiles both and times
# grad_log_prob() in alternating blocks on the same runner. The ratio goes into
# the job summary and, for a PR from this repository, a comment. Absolute
# times on a shared runner are noise; the ratio is not.
#
# Both reuse the CmdStan cache of R-CMD-check.yaml (same key).

on:
  pull_request:
  workflow_dispatch:
    inputs:
      cost:
        description: 'Also time gradients against the default branch'
        type: boolean
        default: false

name: numerics

permissions:
  contents: read

env:
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
  R_KEEP_PKG_SOURCE: yes
  NOT_CRAN: true

jobs:
  gradient-check:
    runs-on: ubuntu-latest
    name: gradient check
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
          extra-repositories: 'https://mc-stan.org/r-packages/'

      # cmdstanr is a Suggests dependency, which setup-r-dependencies installs
      # by default; it is named here as well so that the job does not hang on
      # that default (the mc-stan repository above is where it resolves from).
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, any::jsonlite, any::cmdstanr

      - name: Latest CmdStan release
        id: cmdstan-version
        shell: bash
        run: |
          tag=$(curl -sSL --retry 3 \
            -H "Authorization: Bearer ${GITHUB_PAT}" \
            https://api.github.com/repos/stan-dev/cmdstan/releases/latest \
            | jq -r '.tag_name // empty')
          if [ -z "$tag" ]; then
            echo "Could not determine the latest CmdStan release" >&2
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: CmdStan install path
        id: cmdstan-path
        run: |
          cat(sprintf("path=%s\n", cmdstanr::cmdstan_default_install_path()),
              file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
        shell: Rscript {0}

      - name: Cache CmdStan
        id: cmdstan-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.cmdstan-path.outputs.path }}
          key: cmdstan-${{ runner.os }}-${{ steps.cmdstan-version.outputs.version }}

      - name: CmdStan toolchain
        run: cmdstanr::check_cmdstan_toolchain(fix = TRUE)
        shell: Rscript {0}

      - name: Build CmdStan
        if: ${{ steps.cmdstan-cache.outputs.cache-hit != 'true' }}
        run: |
          cmdstanr::install_cmdstan(
            cores = parallel::detectCores(),
            version = "${{ steps.cmdstan-version.outputs.version }}"
          )
        shell: Rscript {0}

      - name: Check gradients
        run: Rscript benchmarks/gradient_check.R --cores 4

      - name: Job summary
        if: always()
        run: cat benchmarks/results/gradient_check/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradient-check
          path: benchmarks/results/gradient_check/*.csv

  gradient-cost:
    # Label-gated on pull requests: two compilations per changed family is more
    # than a routine PR should pay for.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.cost) ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'benchmark'))
    runs-on: ubuntu-latest
    name: gradient cost vs base
    # Read-only, like everything that executes code from the pull request. The
    # comment is posted by the job below, which runs none of it.
    steps:
      - uses: actions/checkout@v4
        with:
          path: pr

      - uses: actions/checkout@v4
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
          extra-repositories: 'https://mc-stan.org/r-packages/'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: pr
          extra-packages: any::pkgload, any::jsonlite, any::cmdstanr

      - name: Latest CmdStan release
        id: cmdstan-version
        shell: bash
        run: |
          tag=$(curl -sSL --retry 3 \
            -H "Authorization: Bearer ${GITHUB_PAT}" \
            https://api.github.com/repos/stan-dev/cmdstan/releases/latest \
            | jq -r '.tag_name // empty')
          if [ -z "$tag" ]; then
            echo "Could not determine the latest CmdStan release" >&2
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: CmdStan install path
        id: cmdstan-path
        run: |
          cat(sprintf("path=%s\n", cmdstanr::cmdstan_default_install_path()),
              file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
        shell: Rscript {0}

      - name: Cache CmdStan
        id: cmdstan-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.cmdstan-path.outputs.path }}
          key: cmdstan-${{ runner.os }}-${{ steps.cmdstan-version.outputs.version }}

      - name: CmdStan toolchain
        run: cmdstanr::check_cmdstan_toolchain(fix = TRUE)
        shell: Rscript {0}

      - name: Build CmdStan
        if: ${{ steps.cmdstan-cache.outputs.cache-hit != 'true' }}
        run: |
          cmdstanr::install_cmdstan(
            cores = parallel::detectCores(),
            version = "${{ steps.cmdstan-version.outputs.version }}"
          )
        shell: Rscript {0}

      # The PR's copy of the scripts drives both trees: the base may predate
      # them. Each tree is loaded in a process of its own.
      - name: Emit programs from both trees
        working-directory: pr
        run: |
          Rscript benchmarks/gradient_cost.R emit --pkg ../base --out "$RUNNER_TEMP/base"
          Rscript benchmarks/gradient_cost.R emit --pkg .       --out "$RUNNER_TEMP/pr"

      - name: Time gradients
        id: time
        working-directory: pr
        run: Rscript benchmarks/gradient_cost.R time --base "$RUNNER_TEMP/base" --pr "$RUNNER_TEMP/pr"

      - name: Job summary
        if: always()
        run: cat pr/benchmarks/results/gradient_cost/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradient-cost
          path: |
            pr/benchmarks/results/gradient_cost/*.csv
            pr/benchmarks/results/gradient_cost/summary.md

  # The one job with a write-capable token runs nothing from the pull request:
  # it downloads the summary the job above produced and posts it. Keeping the
  # token out of the job that executes PR code is what makes `pull-requests:
  # write` safe to grant. Fork PRs get a read-only token whatever is asked for;
  # for them the job summary and the artifact are the report.
  comment:
    needs: gradient-cost
    if: >-
      always() && needs.gradient-cost.result != 'skipped' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: comment on the pull request
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gradient-cost
          path: report

      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f report/summary.md || { echo "no summary to post"; exit 0; }
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --edit-last --body-file report/summary.md \
          || gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body-file report/summary.md
