on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Run the full test suite here, including the parts skipped on CRAN.
      NOT_CRAN: true
      # ...and the model-fitting tests, which are opt-in because each compiles
      # its own Stan program. They still need cmdstanr, which the step below
      # removes, so on this workflow they skip either way; the variable is set
      # so that a job which does provide CmdStan runs them unchanged.
      COGMOD_TEST_SLOW: true
      # cmdstanr is deliberately absent (see below), and R CMD check otherwise
      # errors out on a suggested package it cannot find.
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          # pak resolves dependencies from the configured repositories only - it
          # does not read Additional_repositories out of DESCRIPTION - so
          # without this it cannot find cmdstanr and the lockfile fails to solve.
          extra-repositories: 'https://mc-stan.org/r-packages/'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # Model fitting needs a CmdStan installation, which is far too slow to
      # build here, so those tests are local-only. They guard on
      # skip_if_not_installed("cmdstanr"), which checks for the R package alone:
      # leaving it installed without CmdStan behind it would make them fail
      # rather than skip. Dropping it here is what makes them skip.
      - name: Remove cmdstanr (Stan tests are local-only)
        run: |
          if ("cmdstanr" %in% rownames(installed.packages())) {
            remove.packages("cmdstanr")
          }
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
