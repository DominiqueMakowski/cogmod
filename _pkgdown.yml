url: "https://dominiquemakowski.github.io/cogmod/"
template:
    bootstrap: 5

navbar:
    components:
        articles:
            text: Articles
            menu:
                - text: "Overview"
                  href: articles/overview.html
                - text: "Subjective Ratings"
                  href: articles/subjective_ratings.html
                - text: "RT-only Models"
                  href: articles/rt_models.html
                - text: "Outliers and Non-Decision Time"
                  href: articles/outliers.html
                - text: "Decision Making Models"
                  href: articles/decision_making.html
                - text: "Assessing Reliability"
                  href: articles/reliability.html

reference:
    - title: "Subjective Scales Data"
    - subtitle: "Unimodal Distributions"
      contents:
          - rcogmod_betadiscrete
          - rcogmod_betagate
    - subtitle: "Multiprocess Models"
      contents:
          - rcogmod_choco
    - title: "Decision Making Data (Choice and RT)"
      contents:
          - rcogmod_lnr
          - rcogmod_lba2
          - rcogmod_ddm
          - rcogmod_rdm
    - title: "RT-only Models"
      contents:
          - rcogmod_lognormal
          - rcogmod_loggamma
          - rcogmod_invgaussian
          - rcogmod_gamma
          - rcogmod_invgamma
          - rcogmod_weibull
          - rcogmod_logweibull
          - rcogmod_invweibull
          - rcogmod_exgaussian
          - rcogmod_lba1
    - title: "Other"
      contents:
          - cogmod_priors
          - cogmod_inits
          - cogmod_stanvars
          - p_outlier
          - with_outliers
          # - conf_sdt  # commented out until the confidence SDT model is ready
          - badlm
